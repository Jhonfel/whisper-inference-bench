[project]
name = "whisper-inference-bench"
version = "0.1.0"
description = "What actually makes Whisper fast on one GPU, measured: the transformers recipe vs OpenAI's reference, and SageAttention 2/3 as proper attention backends"
readme = "README.md"
license = "MIT"
authors = [{ name = "Jhon Felipe Delgado" }]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.8",
    "transformers>=4.56,<5",
    "accelerate",
    "numpy",
    "soundfile",
    "librosa",
]

[project.optional-dependencies]
server = ["flask>=3"]
bench = ["jiwer", "openai-whisper", "matplotlib"]
# SageAttention is built from source (see README): pip install sageattention==2.2.0 --no-build-isolation

[project.scripts]
whisper-sage = "whisper_sage.cli:main"
whisper-sage-server = "whisper_sage.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whisper_sage"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
